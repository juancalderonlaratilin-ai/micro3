<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Circuito UART: módulo USB-TTL CP2102 ↔ PIC16F18426</text>

  <!-- Módulo CP2102 -->
  <rect x="40" y="80" width="200" height="230" rx="6" fill="#eef3fb" stroke="#1f3a68" stroke-width="2"/>
  <text x="140" y="104" text-anchor="middle" font-weight="bold" fill="#1f3a68">Módulo USB-TTL</text>
  <text x="140" y="122" text-anchor="middle" fill="#1f3a68">CP2102</text>
  <text x="230" y="154" text-anchor="end" fill="#111">TXD</text>
  <text x="230" y="204" text-anchor="end" fill="#111">RXD</text>
  <text x="230" y="264" text-anchor="end" fill="#111">GND</text>
  <text x="52" y="296" fill="#555" font-size="12">3V3, 5V, RTS, CTS: sin conectar</text>

  <!-- PIC -->
  <rect x="620" y="60" width="200" height="400" rx="6" fill="#fdf3e7" stroke="#8a4b08" stroke-width="2"/>
  <text x="720" y="340" text-anchor="middle" font-weight="bold" font-size="16" fill="#8a4b08">PIC16F18426</text>
  <text x="630" y="154" fill="#111">RC5 / RX1 (pin 5)</text>
  <text x="630" y="204" fill="#111">RC4 / TX1 (pin 6)</text>
  <text x="810" y="244" text-anchor="end" fill="#111" font-size="13">RA3 / MCLR</text>
  <text x="810" y="260" text-anchor="end" fill="#111" font-size="13">(pin 4)</text>
  <text x="720" y="86" text-anchor="middle" fill="#111">VDD (pin 1)</text>
  <text x="720" y="448" text-anchor="middle" fill="#111">VSS (pin 14)</text>

  <!-- TXD -> RC5 -->
  <line x1="240" y1="150" x2="620" y2="150" stroke="#0b6bcb" stroke-width="2.5"/>
  <text x="430" y="140" text-anchor="middle" fill="#0b6bcb">TXD del adaptador → RX del PIC (3,3 V)</text>

  <!-- RC4 -> R1 -> nodo -> RXD -->
  <line x1="620" y1="200" x2="540" y2="200" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="480" y="190" width="60" height="20" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="510" y="184" text-anchor="middle" fill="#c0392b">R1 1 kΩ</text>
  <line x1="480" y1="200" x2="240" y2="200" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="380" cy="200" r="4" fill="#c0392b"/>
  <text x="394" y="228" fill="#c0392b" font-size="13">≈2,5 V al adaptador</text>
  <!-- R2 -->
  <line x1="380" y1="200" x2="380" y2="270" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="370" y="270" width="20" height="60" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="304" fill="#c0392b">R2 2,2 kΩ</text>
  <line x1="380" y1="330" x2="380" y2="500" stroke="#444" stroke-width="2.5"/>
  <text x="560" y="168" text-anchor="middle" fill="#c0392b" font-size="13">TX del PIC (3,7 V)</text>

  <!-- GND del adaptador -->
  <line x1="240" y1="260" x2="300" y2="260" stroke="#444" stroke-width="2.5"/>
  <line x1="300" y1="260" x2="300" y2="500" stroke="#444" stroke-width="2.5"/>

  <!-- Bus GND -->
  <line x1="300" y1="500" x2="950" y2="500" stroke="#444" stroke-width="2.5"/>
  <circle cx="300" cy="500" r="4" fill="#444"/>
  <circle cx="380" cy="500" r="4" fill="#444"/>
  <text x="310" y="522" fill="#444">GND común (fuente, PIC y adaptador)</text>
  <line x1="720" y1="460" x2="720" y2="500" stroke="#444" stroke-width="2.5"/>
  <circle cx="720" cy="500" r="4" fill="#444"/>

  <!-- Riel VDD -->
  <line x1="560" y1="40" x2="950" y2="40" stroke="#b5271d" stroke-width="2.5"/>
  <text x="548" y="45" text-anchor="end" fill="#b5271d">+3,7 V (fuente Keysight) →</text>
  <line x1="720" y1="40" x2="720" y2="60" stroke="#b5271d" stroke-width="2.5"/>
  <circle cx="720" cy="40" r="4" fill="#b5271d"/>

  <!-- Pull-up MCLR -->
  <line x1="860" y1="40" x2="860" y2="110" stroke="#b5271d" stroke-width="2.5"/>
  <circle cx="860" cy="40" r="4" fill="#b5271d"/>
  <rect x="850" y="110" width="20" height="60" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="840" y="144" text-anchor="end" fill="#111">10 kΩ</text>
  <line x1="860" y1="170" x2="860" y2="250" stroke="#444" stroke-width="2.5"/>
  <line x1="820" y1="250" x2="860" y2="250" stroke="#444" stroke-width="2.5"/>
  <circle cx="860" cy="250" r="4" fill="#444"/>
  <text x="870" y="246" fill="#444" font-size="12">al SNAP</text>
  <text x="870" y="262" fill="#444" font-size="12">(MCLR)</text>

  <!-- Capacitor 100 nF -->
  <line x1="950" y1="40" x2="950" y2="380" stroke="#b5271d" stroke-width="2.5"/>
  <line x1="930" y1="380" x2="970" y2="380" stroke="#444" stroke-width="3"/>
  <line x1="930" y1="400" x2="970" y2="400" stroke="#444" stroke-width="3"/>
  <line x1="950" y1="400" x2="950" y2="500" stroke="#444" stroke-width="2.5"/>
  <circle cx="950" cy="40" r="4" fill="#b5271d"/>
  <circle cx="950" cy="500" r="4" fill="#444"/>
  <text x="920" y="394" text-anchor="end" fill="#111">100 nF</text>
  <text x="920" y="426" text-anchor="end" fill="#111" font-size="12">junto a los pines 1 y 14</text>

  <!-- Notas -->
  <text x="40" y="548" fill="#333" font-size="13">Divisor: 3,7 V × 2,2 / (1 + 2,2) = 2,54 V. El adaptador (3,3 V) exige VIH ≥ 1,9 V y soporta como máximo VIO + 0,5 V = 3,8 V.</text>
</svg>
